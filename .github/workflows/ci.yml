name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  auditoria-dependencias:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Auditar vulnerabilidades altas y críticas
        env:
          NO_COLOR: "1"
        run: |
          set -o pipefail
          {
            echo "## Auditoría de dependencias — frontend"
            echo
            npm run audit:security
          } 2>&1 | tee npm-audit-frontend.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publicar reporte de auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-frontend-${{ github.run_id }}
          path: npm-audit-frontend.txt
          if-no-files-found: error
          retention-days: 14
