name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy a producción
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-produccion-frontend
      cancel-in-progress: false
    steps:
      - name: Configurar SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # La llave solo puede ejecutar el script de deploy en el servidor
      # (forced command, ver swap-backend/deploy/README.md); "frontend" es el destino.
      - name: Desplegar frontend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" frontend

  version:
    name: Publicar versión
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Crear el tag y el release desplegado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Este commit ya tiene versión; no se crea otra."
            exit 0
          fi
          VERSION="$(bash .github/scripts/siguiente-version.sh)"
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
          echo "### Versión publicada: $VERSION" >> "$GITHUB_STEP_SUMMARY"
