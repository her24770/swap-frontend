name: Staging

# Cada push a develop se despliega en el ambiente de pruebas (SWAP-673), antes de
# llegar a main. Solo corre si el repo tiene la variable STAGING_ACTIVO=true
# (Settings → Variables), que se crea cuando staging ya está instalado en el servidor.
# Ver swap-backend/deploy/README.md → "Staging".
on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy a staging
    if: vars.STAGING_ACTIVO == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging-frontend
      cancel-in-progress: false
    steps:
      - name: Configurar SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # Misma llave y forced command que producción; "staging frontend" no toca producción.
      - name: Desplegar frontend en staging
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" staging frontend
